global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'payment-gateway-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-gateway-service:8080']

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-service:8081']

  - job_name: 'fraud-detection-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['fraud-detection-service:8082']

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-service:8083']
