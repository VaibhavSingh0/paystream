spring:
  application:
    name: payment-gateway-service
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

payment:
  service:
    url: http://localhost:8081

jwt:
  secret: paystream-secret-key-change-in-production-min-32-chars

resilience4j:
  circuitbreaker:
    instances:
      payment-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,circuitbreakers
  metrics:
    export:
      prometheus:
        enabled: true
